# Local stack: PostgreSQL, Redis, MinIO, API, worker.
# All config from .env. For Docker: POSTGRES_HOST=postgres, REDIS_URL=redis://redis:6379/0, S3_ENDPOINT_URL=http://minio:9000.
# App image uses pre-baked docling-serve-cpu base (faster build). To build from scratch use: dockerfile: Dockerfile

services:
  postgres:
    image: postgres:16-alpine
    env_file: .env
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 5

  minio:
    image: minio/minio:latest
    command: server /data
    env_file: .env
    ports:
      - "9000:9000"
    volumes:
      - minio_data:/data

  minio-init:
    image: flow-graph-deps
    build:
      context: .
      dockerfile: Dockerfile.docling-base
    env_file: .env
    volumes:
      - .:/app
    entrypoint: ["sh", "-c", "pip install -e . --no-deps && exec \"$@\"", "sh"]
    command: >
      python -c "
      import boto3, os, time
      from botocore.exceptions import ClientError
      ep, bucket = os.environ['S3_ENDPOINT_URL'], os.environ['S3_BUCKET']
      for i in range(30):
        try:
          c = boto3.client('s3', endpoint_url=ep, region_name='us-east-1')
          c.create_bucket(Bucket=bucket)
          print('Bucket', bucket, 'created')
          break
        except ClientError as e:
          if e.response.get('Error', {}).get('Code') in ('BucketAlreadyOwnedByYou', 'BucketAlreadyExists'):
            break
          time.sleep(1)
        except Exception:
          time.sleep(1)
      else:
        raise SystemExit('MinIO not ready')
      "
    depends_on:
      minio:
        condition: service_started

  migrate:
    image: flow-graph-deps
    build:
      context: .
      dockerfile: Dockerfile.docling-base
    env_file: .env
    volumes:
      - .:/app
    entrypoint: ["sh", "-c", "pip install -e . --no-deps && exec \"$@\"", "sh"]
    command: python -m alembic upgrade head
    depends_on:
      postgres:
        condition: service_healthy

  api:
    image: flow-graph-deps
    build:
      context: .
      dockerfile: Dockerfile.docling-base
    env_file: .env
    volumes:
      - .:/app
    entrypoint: ["sh", "-c", "pip install -e . --no-deps && exec \"$@\"", "sh"]
    command: uvicorn app.api.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8000/health/ready || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s

  worker:
    image: flow-graph-deps
    build:
      context: .
      dockerfile: Dockerfile.docling-base
    env_file: .env
    volumes:
      - .:/app
    entrypoint: ["sh", "-c", "pip install -e . --no-deps && exec \"$@\"", "sh"]
    command: arq app.workers.arq_tasks.WorkerSettings
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  postgres_data:
  minio_data:
