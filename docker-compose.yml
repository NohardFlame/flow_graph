# Local stack: PostgreSQL, Redis, MinIO, API, worker.
# Run migrations once: docker compose run --rm migrate
# Then: docker compose up
# Or first time: docker compose up (migrate runs first, then api and worker start).

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: app
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 5

  minio:
    image: minio/minio:latest
    command: server /data
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"

  minio-init:
    build: .
    command: >
      python -c "
      import boto3, os, time
      from botocore.exceptions import ClientError
      ep, bucket = os.environ['S3_ENDPOINT_URL'], os.environ['S3_BUCKET']
      for i in range(30):
        try:
          c = boto3.client('s3', endpoint_url=ep, region_name='us-east-1')
          c.create_bucket(Bucket=bucket)
          print('Bucket', bucket, 'created')
          break
        except ClientError as e:
          if e.response.get('Error', {}).get('Code') in ('BucketAlreadyOwnedByYou', 'BucketAlreadyExists'):
            break
          time.sleep(1)
        except Exception:
          time.sleep(1)
      else:
        raise SystemExit('MinIO not ready')
      "
    environment:
      S3_ENDPOINT_URL: http://minio:9000
      S3_BUCKET: flow-graph
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
    depends_on:
      minio:
        condition: service_started

  migrate:
    build: .
    command: python -m alembic upgrade head
    environment:
      ENVIRONMENT: local
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: app
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build: .
    command: uvicorn app.api.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    environment:
      ENVIRONMENT: local
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: app
      REDIS_URL: redis://redis:6379/0
      S3_ENDPOINT_URL: http://minio:9000
      S3_BUCKET: flow-graph
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8000/health/ready || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s

  worker:
    build: .
    command: arq app.workers.arq_tasks.WorkerSettings
    environment:
      ENVIRONMENT: local
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: app
      REDIS_URL: redis://redis:6379/0
      S3_ENDPOINT_URL: http://minio:9000
      S3_BUCKET: flow-graph
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    restart: unless-stopped
