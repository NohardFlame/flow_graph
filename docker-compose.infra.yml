# Infrastructure only: Postgres, Redis, MinIO. No app containers.
# Use with: docker compose -f docker-compose.infra.yml up -d
# Then run API and worker on the host (see scripts/up-infra.ps1 and .env.example.host).

services:
  postgres:
    image: postgres:16-alpine
    env_file: .env
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 5

  minio:
    image: minio/minio:latest
    command: server /data
    env_file: .env
    ports:
      - "9000:9000"
    volumes:
      - minio_data:/data

volumes:
  postgres_data:
  minio_data:
